[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
  "E741",   # ambiguous `l` names already renamed in the hot paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]  # conftest sets the test environment before importing app.*

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::pytest.PytestDeprecationWarning",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
