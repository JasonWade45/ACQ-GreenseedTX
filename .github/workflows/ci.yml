name: CI

# Every change is verified before it can reach main: backend tests and lint, the
# bundled interface, the Docker image that the server paths use, and the release ZIP.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-lock.txt
      - name: Lint
        run: python -m ruff check .
      - name: Deploy scripts parse and their help works
        run: |
          bash -n deploy/install.sh
          bash -n deploy/docker-entrypoint.sh
          bash -n start-acq.sh
          bash -n update-acq.sh
          cat deploy/install.sh | bash -s -- --help | grep -q -- "--no-https"
      - name: The one-click updater updates a real installation
        run: |
          # Copy this checkout into a "new release" folder and a separate "old install",
          # put a real record and a real password in the old one, then update it and prove
          # the data, the password and the existing record survive byte for byte.
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/new-release" "$work/old-install"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=.venv -cf - . \
            | tar -C "$work/new-release" -xf -
          cp -a "$work/new-release/." "$work/old-install/"
          printf 'APP_ACCESS_PASSWORD=Ci-Update-Password-123\nSESSION_SECRET=%s\n' "$(openssl rand -hex 32)" \
            > "$work/old-install/.env"
          # Make the old copy look like a real 1.2.5 install: older version, no updater yet.
          sed -i 's/APP_VERSION = "[^"]*"/APP_VERSION = "1.2.5"/' "$work/old-install/backend/app/version.py"
          rm -f "$work/old-install/UPDATE-ACQ.cmd" "$work/old-install/update-acq.sh" \
                "$work/old-install/scripts/update_acq.py"
          python -m venv "$work/old-install/.venv"
          "$work/old-install/.venv/bin/python" -m pip install --disable-pip-version-check -q \
            -r "$work/old-install/backend/requirements-lock.txt"
          cd "$work/old-install"
          "$work/old-install/.venv/bin/python" scripts/manage.py migrate > /dev/null
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/acquisitions.db")
          db.execute(
              "INSERT INTO leads (full_name, stage_code, local_stage_override, contact_status, "
              "local_do_not_contact, restriction_reviewed, source_kind, source_data, created_at, updated_at) "
              "VALUES ('تحديث تلقائي', 'new', 0, 'not_contacted', 0, 0, 'manual', '{}', "
              "datetime('now'), datetime('now'))"
          )
          db.commit()
          PY
          before_env=$(sha256sum .env | cut -d' ' -f1)
          # Compare the database by content: migrating rewrites pages, so file bytes can
          # legitimately differ even when every row and every value is unchanged.
          db_dump() {
            python - "$1" <<'PY'
          import hashlib, sqlite3, sys
          # A first start writes one default app_settings row; every real record must match.
          rows = [
              line
              for line in sqlite3.connect(sys.argv[1]).iterdump()
              if 'INSERT INTO "app_settings"' not in line
          ]
          print(hashlib.sha256("\n".join(rows).encode()).hexdigest())
          PY
          }
          before_db=$(db_dump data/acquisitions.db)
          cd "$work/new-release"
          python scripts/update_acq.py --target "$work/old-install" --yes
          test -f "$work/old-install/UPDATE-ACQ.cmd"
          test -f "$work/old-install/scripts/update_acq.py"
          test "$(sha256sum "$work/old-install/.env" | cut -d' ' -f1)" = "$before_env"
          after_db=$(cd "$work/old-install" && db_dump data/acquisitions.db)
          test "$after_db" = "$before_db" || { echo "database content changed during the update"; exit 1; }
          ls "$work/old-install/backups"/before-update-*.db > /dev/null
          python - "$work/old-install/data/acquisitions.db" <<'PY'
          import sqlite3, sys
          rows = sqlite3.connect(sys.argv[1]).execute("SELECT full_name FROM leads").fetchall()
          assert ("تحديث تلقائي",) in rows, rows
          print("updater: data, password and the existing record survived")
          PY

      - name: Documentation references resolve
        run: python scripts/check_references.py
      - name: The packaged layout boots with data kept outside it
        run: python scripts/test_frozen_layout.py
      - name: The desktop program starts, keeps its data and restarts on it
        run: python scripts/smoke_desktop_app.py
      - name: Tests
        run: python -m pytest -q

  postgres:
    name: PostgreSQL migrations, backups and a copied workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A disposable PostgreSQL, because these tests drop and recreate the public schema.
    # The SQLite tests keep running in the backend job; nothing here replaces them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/acq_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-lock.txt
      - name: Migrations, logical backups and the SQLite migration script
        run: python -m pytest backend/tests/test_postgres.py -q

  interface:
    name: Interface build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test

  browser:
    name: Browser tests on a disposable workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-lock.txt
          npm ci --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # The suite builds the interface, starts a throwaway server with a synthetic
      # database and a random password, and tears it down afterwards.
      - name: Run the browser suite
        id: browser
        run: |
          set -o pipefail
          python scripts/test_browser.py 2>&1 | tee docs/browser-log.txt
      # The console log is not always reachable from a phone, so when the suite fails
      # the failing test and its message are raised as annotations on the run.
      - name: Name the browser test that failed
        if: always() && steps.browser.outcome == 'failure'
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          def note(title, body):
              safe = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title={title}::{safe[:5500]}")

          path = pathlib.Path("docs/browser-test-results.xml")
          if not path.exists():
              print("::error title=Browser results::No XML report was written")
              log = pathlib.Path("docs/browser-log.txt")
              if log.exists():
                  note("Browser console tail", log.read_text(errors="replace")[-5000:])
              raise SystemExit(0)

          root = ET.parse(path).getroot()
          failed = 0
          for case in root.iter("testcase"):
              for failure in case.findall("failure"):
                  failed += 1
                  name = f"{case.get('classname', '')} :: {case.get('name', '')}".strip()
                  text = " ".join((failure.text or failure.get("message") or "").split())
                  print(f"::error title=Browser test failed::{name} - {text[:6000]}")
          if failed:
              print(f"{failed} browser test(s) failed")
              raise SystemExit(0)
          # The suite exited non-zero but the report shows no failing test: the failure
          # is in the run itself, so show what the console said.
          print("::warning title=Browser results::No testcase failure in the report")
          log = pathlib.Path("docs/browser-log.txt")
          if log.exists():
              note("Browser console tail", log.read_text(errors="replace")[-5000:])
          note(
              "Browser cases",
              " | ".join(case.get("name", "") for case in root.iter("testcase")),
          )
          note("Browser report head", " ".join(path.read_text(errors="replace").split())[:2500])
          PY

      - name: Keep the results when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            docs/browser-test-results.xml
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image starts with or without a password
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t acq:ci .
      - name: Refuses to start without a strong password
        run: |
          set +e
          docker run --rm -e APP_ACCESS_PASSWORD=short acq:ci
          code=$?
          set -e
          test "$code" -ne 0 || { echo "The container started with a 5-character password"; exit 1; }
      - name: Serves health, login and an authenticated request
        run: |
          docker run -d --name acq -p 8000:8000 \
            -e APP_ACCESS_PASSWORD=ci-verification-password acq:ci
          for attempt in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200" || { docker logs acq; exit 1; }
          test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)" = "200"
          test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/leads)" = "401"
          token=$(curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"password":"ci-verification-password"}' \
            http://127.0.0.1:8000/api/auth/login | python -c "import json,sys; print(json.load(sys.stdin)['token'])")
          test "$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" http://127.0.0.1:8000/api/leads)" = "200"
          test "$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" http://127.0.0.1:8000/api/backups)" = "200"
          docker rm -f acq

  package:
    name: Release archive
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the ZIP and verify its checksum
        run: |
          python scripts/package_release.py --output release.zip
          python - <<'PY'
          import hashlib, pathlib
          archive = pathlib.Path("release.zip")
          declared = pathlib.Path("release.zip.sha256").read_text().split()[0]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert declared == actual, "checksum file does not match the archive"
          print(f"{archive.name}: {archive.stat().st_size:,} bytes, sha256 {actual}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            release.zip
            release.zip.sha256
          retention-days: 14
      # The archive is published from the tagged run: the maintainer's machine cannot
      # always reach the asset upload endpoint, and the tag build already has the file.
      - name: Attach the archive to the release when this is a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release.zip
            release.zip.sha256
